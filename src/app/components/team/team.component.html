<mat-card class="mdc-card card team-card">
    <div class="team-card-header">
        <div>Team:</div>
        <div class="team-confirmed-status" *ngIf="pointsConfirmed">
            <mat-icon>check</mat-icon>
            Confirmed
        </div>
        <div class="team-confirmed-status unconfirmed" *ngIf="!pointsConfirmed">
            Unconfirmed
        </div>
    </div>
    <div>
        <app-team-player *ngFor="let teamPlayer of teamPlayers" [teamPlayer]="teamPlayer"></app-team-player>
    </div>
    <div>
        <mat-form-field class="full-width" appearance="fill">
            <mat-label>Points</mat-label>
            <input matInput id="teamPoints" placeholder="0" type="number" pattern="\d*" [formControl]="teamPointsFormControl" (focus)="onPointsFocus($event)" (input)="onPointsInput()" (blur)="onPointsBlur()">
          </mat-form-field>
    </div>
    <div>
        <button mat-raised-button color="primary" class="full-width" (click)="toggleConfirmPoints(true)" *ngIf="!currentUserTeamConfirmed && canConfirmPoints">
            <mat-icon>check</mat-icon>
            {{isCurrentUserOnTeam ? 'Submit Score' : 'Confirm Score'}}
        </button>

        <button mat-raised-button color="accent" class="full-width" (click)="toggleConfirmPoints(false)" *ngIf="currentUserTeamConfirmed && canConfirmPoints">
            <mat-icon>cancel</mat-icon>
            {{isCurrentUserOnTeam ? 'Change Score' : 'Change Confirmation'}}
        </button>
    </div>
</mat-card>
