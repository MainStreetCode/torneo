<div class="flex-box-rows" *ngIf="showHeader">
    <mat-toolbar color="accent">
        <span class="flex-box-item">Rounds</span>
    </mat-toolbar>
</div>

<mat-card class="rounds-empty-state" *ngIf="rounds.length === 0">
    <div class="empty-icon">
        <mat-icon aria-hidden="true">{{emptyRoundsIcon}}</mat-icon>
    </div>
    <div class="empty-copy">
        <h2>{{emptyRoundsTitle}}</h2>
        <p>{{emptyRoundsMessage}}</p>
    </div>
    <button mat-raised-button color="primary" *ngIf="showEmptyRoundsAction" (click)="takeEmptyRoundsAction()">
        <mat-icon>{{emptyRoundsActionIcon}}</mat-icon>
        {{emptyRoundsActionText}}
    </button>
</mat-card>

<div *ngIf="rounds.length > 0" class="rounds">
  <app-round-card *ngFor="let round of rounds" [round]="round" [gameId]="game.id"></app-round-card>
</div>
