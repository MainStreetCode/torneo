<section class="tables-view">
  <mat-card class="tables-summary">
    <div class="tables-title-group">
      <div class="tables-icon">
        <mat-icon aria-hidden="true">table_bar</mat-icon>
      </div>
      <div>
        <div class="tables-eyebrow">Tables</div>
        <h2>{{tableCountLabel}}</h2>
        <p>{{filterStatusLabel}}</p>
      </div>
    </div>

    <button mat-stroked-button color="primary" class="filter-action" *ngIf="isUserPlayer" (click)="filterTables()">
      <mat-icon>{{filterActionIcon}}</mat-icon>
      {{filterActionLabel}}
    </button>
  </mat-card>

  <div class="table-list">
    <app-table-detail [table]="table" *ngFor="let table of filteredTables; trackBy: trackByTableId"></app-table-detail>
  </div>
</section>
