<mat-toolbar color="accent" class="flex-box-rows">
    <div class="flex-box-item flex-box-item-large">Tables</div>
    <div *ngIf="isUserPlayer">
      <div class="flex-box-item">
         <button mat-raised-button color="primary" (click)="filterTables()" *ngIf="isDataFiltered">Show all tables</button>
      </div>
      <div class="flex-box-item">
        <button mat-raised-button color="primary" (click)="filterTables()" *ngIf="!isDataFiltered">Show my table</button>
      </div>
    </div>
</mat-toolbar>

<app-table-detail [table]="table" *ngFor="let table of filteredTables; trackBy: trackByTableId"></app-table-detail>
