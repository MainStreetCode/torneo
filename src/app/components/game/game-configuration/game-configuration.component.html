<section class="configuration-page" *ngIf="(isAdmin$ | async) === false">
  <mat-card class="configuration-card empty-state">
    <div class="empty-icon">
      <mat-icon aria-hidden="true">lock</mat-icon>
    </div>
    <h1>Access restricted</h1>
    <p>You do not have access to configure this game.</p>
    <button mat-raised-button color="primary" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </mat-card>
</section>

<div *ngIf="game && (isAdmin$ | async)">
  <app-section-header [sectionName]="sectionName"></app-section-header>

  <section class="configuration-page">
    <mat-card class="configuration-card">
      <div class="configuration-hero">
        <div class="hero-copy">
          <mat-chip-list aria-label="Configuration status">
            <mat-chip color="accent" selected>Configuration</mat-chip>
          </mat-chip-list>
          <h1>{{game.name}}</h1>
          <div class="game-id">
            <mat-icon aria-hidden="true">tag</mat-icon>
            <span>{{game.id}}</span>
          </div>
        </div>

        <div class="quick-actions">
          <button mat-raised-button color="accent" (click)="save()" [disabled]="isSaving">
            <mat-icon>save</mat-icon>
            {{isSaving ? 'Saving' : 'Save'}}
          </button>
          <button mat-raised-button color="primary" (click)="startGame()">
            <mat-icon>play_arrow</mat-icon>
            Start Game
          </button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="settings-layout">
        <div class="settings-form">
          <div class="section-title">
            <mat-icon aria-hidden="true">tune</mat-icon>
            <span>Game settings</span>
          </div>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Game name</mat-label>
            <input id="game-name" matInput placeholder="Angela's Euchre Tournament" [(ngModel)]="game.name" [disabled]="isSaving">
          </mat-form-field>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Number of rounds</mat-label>
            <input id="game-rounds" matInput placeholder="8" [(ngModel)]="game.numberOfRounds" [disabled]="isSaving">
          </mat-form-field>
        </div>

        <div class="share-panel">
          <div class="share-copy">
            <mat-icon aria-hidden="true">qr_code_2</mat-icon>
            <div>
              <div class="share-title">Dashboard link</div>
              <div class="share-subtitle">Players can scan this code to open the game dashboard.</div>
            </div>
          </div>
          <div class="qr-frame">
            <qrcode *ngIf="gameURL" [qrdata]="gameURL" [width]="176" [errorCorrectionLevel]="'M'"></qrcode>
          </div>
        </div>
      </div>
    </mat-card>

    <mat-card class="players-card">
      <div class="players-card-header">
        <div class="section-title">
          <mat-icon aria-hidden="true">group</mat-icon>
          <span>Players</span>
        </div>
      </div>
      <app-game-players [game]="game"></app-game-players>
    </mat-card>
  </section>
</div>
