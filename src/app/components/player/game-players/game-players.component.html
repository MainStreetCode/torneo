<div class="players">
  <div class="flex-box-rows">
    <mat-toolbar color="accent">
      <div class="flex-box-item">Players</div>
    </mat-toolbar>  
  </div>
  
  <mat-toolbar color="secondary">
    <span>Player List ({{players.length}})</span>
  </mat-toolbar>
  <div class="player-list">      
    <app-player-card *ngFor="let player of players; index as i" [player]="player" [position]="i+1"></app-player-card>
  </div>

  <div *ngIf="this.isAdmin$ | async">
    <mat-toolbar color="secondary"><span>Add new player</span></mat-toolbar>
  
    <div class="content flex-box-rows">
      <div>
        <mat-form-field class="example-full-width" appearance="fill">
          <mat-label>Player name</mat-label>
          <input matInput id="new-player" #playerName placeholder="Player Name" value="" [disabled]="hasRoundsStarted">
        </mat-form-field>
        <div class="blocked-reason" *ngIf="hasRoundsStarted">
          <mat-icon aria-hidden="true">lock</mat-icon>
          <span>Players cannot be added after round 1 starts.</span>
        </div>
      </div>
  
      <div>
        <!-- (click) passes input value to add() and then clears the input -->
        <button mat-raised-button color="primary" [disabled]="hasRoundsStarted || !playerName.value"
          (click)="add(playerName.value); playerName.value=''">
          <mat-icon>add</mat-icon>
          <span class="mdc-button__label">
            <span class="mdc-button__label">Add player</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
