<div class="players">
  <mat-toolbar color="secondary" *ngIf="showHeader">
    <span>{{hasScores ? 'Standings' : 'Players'}} ({{players.length}})</span>
  </mat-toolbar>
  <div class="player-list">
    <div class="standings-header" [class.with-actions]="isAdmin$ | async" *ngIf="players.length > 0">
      <div class="header-position">#</div>
      <div>Player name</div>
      <div class="header-points">Points</div>
      <div class="header-actions" *ngIf="isAdmin$ | async">Actions</div>
    </div>
    <app-player-card *ngFor="let player of players; index as i" [player]="player" [position]="i+1"></app-player-card>
  </div>

  <div class="add-player-section" [class.without-heading]="!showAddPlayerHeader" *ngIf="this.isAdmin$ | async">
    <div class="add-player-heading" *ngIf="showAddPlayerHeader">
      <mat-icon aria-hidden="true">person_add</mat-icon>
      <span>Add new player</span>
    </div>
  
    <div class="content add-player-form">
      <div class="add-player-field">
        <mat-form-field class="example-full-width" appearance="fill">
          <mat-label>Player name</mat-label>
          <input matInput id="new-player" #playerName placeholder="Player Name" value="" [disabled]="hasRoundsStarted">
        </mat-form-field>
        <div class="blocked-reason" *ngIf="hasRoundsStarted">
          <mat-icon aria-hidden="true">lock</mat-icon>
          <span>Players cannot be added after round 1 starts.</span>
        </div>
      </div>
  
      <div class="add-player-actions">
        <!-- (click) passes input value to add() and then clears the input -->
        <button mat-raised-button color="primary" class="add-player-action" [disabled]="hasRoundsStarted || !playerName.value"
          (click)="add(playerName.value); playerName.value=''">
          <mat-icon>add</mat-icon>
          <span class="mdc-button__label">
            <span class="mdc-button__label">Add player</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
