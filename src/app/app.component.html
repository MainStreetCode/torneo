<div class="background-pattern">
  <div class="center main-content">
    <mat-toolbar color="primary" class="header">
      <mat-icon>bar_chart</mat-icon>
      <div class="title">    
        <span (click)="goHome()">{{title}}</span>
      </div>

      <div *ngIf="(isLoggedIn$ | async) === false">
        <button mat-raised-button color="accent" (click)="login()">Login</button>
      </div>

      <div *ngIf="(isLoggedIn$ | async)">
        <button mat-raised-button color="accent" (click)="logout()">Logout</button>
      </div>

      <div *ngIf="(isLoggedIn$ | async)">
        <button mat-icon-button color="primary" aria-label="User profile" (click)="userProfile()">
          <mat-icon color="accent">account_circle</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <nav class="app-nav" aria-label="Primary navigation">
      <a mat-button routerLink="/games" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon aria-hidden="true">emoji_events</mat-icon>
        Tournaments
      </a>
      <a mat-button *ngIf="currentGameId" [routerLink]="['/game', currentGameId, 'dashboard']" routerLinkActive="active-link">
        <mat-icon aria-hidden="true">dashboard</mat-icon>
        Dashboard
      </a>
      <a mat-button *ngIf="currentGameId" [routerLink]="['/game', currentGameId, 'configuration']" routerLinkActive="active-link">
        <mat-icon aria-hidden="true">tune</mat-icon>
        Setup
      </a>
    </nav>

    <nav class="breadcrumbs" *ngIf="breadcrumbs.length > 1" aria-label="Breadcrumb">
      <ng-container *ngFor="let breadcrumb of breadcrumbs; last as isLast">
        <a *ngIf="breadcrumb.url && !isLast; else breadcrumbLabel" [routerLink]="breadcrumb.url">
          {{breadcrumb.label}}
        </a>
        <ng-template #breadcrumbLabel>
          <span [attr.aria-current]="isLast ? 'page' : null">{{breadcrumb.label}}</span>
        </ng-template>
        <mat-icon *ngIf="!isLast" aria-hidden="true">chevron_right</mat-icon>
      </ng-container>
    </nav>

    <router-outlet></router-outlet>
    <!-- <app-system-messages></app-system-messages> -->
  </div>
</div>
